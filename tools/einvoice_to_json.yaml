identity:
  name: "einvoice_to_json"
  author: "glyphcall"
  label:
    en_US: "E-invoice to JSON (XRechnung, ZUGFeRD, Factur-X)"
description:
  human:
    en_US: "Read an XRechnung, ZUGFeRD, Factur-X or other EN 16931 e-invoice as JSON: seller and buyer, every line, the VAT breakdown, totals and the bank account. Exact values from the file, no AI."
  llm: "Converts one EU e-invoice (XRechnung, ZUGFeRD / Factur-X XML or the PDF that embeds it, Peppol or other EN 16931 UBL or CII) to JSON with number, dates, seller, buyer, lines, VAT breakdown, totals and payment account. Values are read from the XML, not guessed. For an invoice that is only a PDF or a scan without embedded XML, use extract_invoice instead."
parameters:
  - name: "file"
    type: file
    required: false
    label:
      en_US: "E-invoice file"
    human_description:
      en_US: "The e-invoice: an XML file, or a ZUGFeRD / Factur-X PDF with the XML inside. Up to 5 MB."
    llm_description: "The e-invoice file: XML, or a ZUGFeRD / Factur-X PDF."
    form: llm
  - name: "xml"
    type: string
    required: false
    label:
      en_US: "XML text"
    human_description:
      en_US: "Instead of a file: the e-invoice XML as text."
    llm_description: "The e-invoice XML as text (UN/CEFACT CII or UBL), used when no file is given."
    form: llm
  - name: "url"
    type: string
    required: false
    label:
      en_US: "File URL"
    human_description:
      en_US: "Instead of a file: the public http(s) URL of the e-invoice."
    llm_description: "Public http(s) URL of the e-invoice, used when no file and no XML text is given."
    form: llm
extra:
  python:
    source: "tools/einvoice_to_json.py"
