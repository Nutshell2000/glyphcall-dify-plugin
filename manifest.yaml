version: "0.2.0"
type: "plugin"
author: "glyphcall"
name: "documents"
label:
  en_US: "Glyphcall Documents: invoice and document extraction"
description:
  en_US: "Read invoices, receipts and any document into JSON fields you name, line items included, and convert PDF, Word, Excel, PowerPoint, scans and photos to Markdown. Optional EU VAT number check of the supplier. Create, validate and read XRechnung, ZUGFeRD and Factur-X e-invoices. One API key; a file that cannot be read is never charged."
icon: "icon.svg"
resource:
  memory: 268435456
  permission:
    tool:
      enabled: true
plugins:
  tools:
    - "provider/glyphcall.yaml"
meta:
  version: "0.0.1"
  arch:
    - "amd64"
    - "arm64"
  runner:
    language: "python"
    version: "3.12"
    entrypoint: "main"
tags:
  - "productivity"
  - "utilities"
  - "finance"
created_at: "2026-11-14T00:00:00Z"
privacy: "PRIVACY.md"
repo: "https://github.com/Nutshell2000/glyphcall-dify-plugin"
contact: "spellz111122@gmail.com"
