identity:
  author: "glyphcall"
  name: "glyphcall"
  label:
    en_US: "Glyphcall Documents"
  description:
    en_US: "Invoices, receipts and documents to JSON fields or Markdown, an EU VAT number check, and XRechnung, ZUGFeRD and Factur-X e-invoices: create, validate, read."
  icon: "icon.svg"
  tags:
    - "productivity"
    - "utilities"
    - "finance"
credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: "API key"
    placeholder:
      en_US: "adt_..."
    help:
      en_US: "Get a key: credits from $1 or a plan from $9 a month"
    url: "https://tools.funwords.eu/credits"
tools:
  - "tools/extract_invoice.yaml"
  - "tools/extract_fields.yaml"
  - "tools/document_to_markdown.yaml"
  - "tools/check_vat_number.yaml"
  - "tools/create_einvoice.yaml"
  - "tools/validate_einvoice.yaml"
  - "tools/einvoice_to_json.yaml"
extra:
  python:
    source: "provider/glyphcall.py"
